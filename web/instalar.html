<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instalar CPE Distancia</title>
  <link rel="icon" type="image/png" href="/CPEV.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Como instalar</h1>

      <div class="install-steps">
        <p>
          <strong>Paso 1.</strong> Arrastra este boton a la barra de "marcadores":
          <a id="bookmarklet-link" class="bookmarklet-link" href="#">Puertas CPE</a>
        </p>
        <p><strong>Paso 2.</strong> Abre <a href="https://portal.cpevalencia.com/" target="_blank" rel="noopener noreferrer">portal.cpevalencia.com</a> e inicia sesion.</p>
        <p><strong>Paso 3.</strong> Ve a <strong>Chapero por especialidades y abre tu especialidad o polivalencia</strong>.</p>
        <p><strong>Paso 4.</strong> Pulsa el marcador <strong>Puertas CPE</strong>, escribe tu chapa y listo.</p>
      </div>
      <div id="status" class="status"></div>
    </section>
  </main>
  <script src="/main.js"></script>
</body>
</html>
