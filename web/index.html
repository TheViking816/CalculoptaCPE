<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distancia Chapero (Cliente)</title>
  <link rel="icon" type="image/png" href="/CPEV.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="top-row">
        <h1>Calculadora Puertas CPE</h1>
        <button id="theme-toggle" type="button" class="secondary theme-toggle">Modo oscuro</button>
      </div>
      <section class="quick-install">
        <h2>Como instalar: Instalar CPE Distancia en 1 minuto</h2>
        <p class="muted small">
          No hace falta tienda ni conocimientos tecnicos. Arrastra este boton a la barra de "marcadores":
          <a id="bookmarklet-link" class="bookmarklet-link" href="#">Puertas CPE</a>
        </p>
      </section>

      <form id="calc-form" class="form">
        <div class="tools">
          <a class="button-link" href="https://portal.cpevalencia.com/" target="_blank" rel="noopener noreferrer">Abrir portal CPE</a>
          <button id="paste-snapshot" type="button" class="secondary">Pegar JSON</button>
        </div>

        <label for="snapshot">Snapshot JSON del chapero</label>
        <textarea id="snapshot" name="snapshot" rows="8" placeholder='{"doors":{"LAB":"7...."},"ordered":[...]}' required></textarea>

        <label for="chapa">Chapa usuario</label>
        <input id="chapa" name="chapa" type="text" inputmode="numeric" placeholder="5 digitos o 72999" required>

        <button id="submit" type="submit">Calcular</button>
      </form>

      <div id="status" class="status"></div>
      <div id="result"></div>
    </section>
  </main>

  <div id="result-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title">Resultado</h2>
        <button id="close-modal" type="button" class="secondary">Cerrar</button>
      </div>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="/main.js"></script>
</body>
</html>
